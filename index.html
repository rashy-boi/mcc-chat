<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Dark sleek background */
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            overflow: hidden;
        }
        .chat-container {
            width: 90%;       /* Takes up 90% of screen width */
            max-width: 800px; /* Limits width so it doesn't stretch too much on desktop */
            height: 80vh;     /* Takes up 80% of the screen height */
            border-radius: 12px; /* Smooth rounded corners */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); /* Drop shadow effect */
            overflow: hidden;
            border: 2px solid #333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Clean iframe layout referencing your Mcc chat room -->
        <iframe src="https://minnit.chat" allow="geolocation; microphone; camera; fullscreen; display-capture"></iframe>
    </div>

</body>
</html>
