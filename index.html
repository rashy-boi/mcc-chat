<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        /* The Wrapper holding the chat and button */
        #chat-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        /* Custom Fullscreen Toggle Button Style */
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #555;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .fullscreen-btn:hover {
            background-color: rgba(51, 51, 51, 0.9);
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="chat-wrapper">
        <!-- Floating Fullscreen Button -->
        <button class="fullscreen-btn" onclick="toggleFullscreen()">📺 Go Fullscreen</button>
        
        <!-- Minnit Chat Frame -->
        <iframe src="https://minnit.chat" allow="geolocation; microphone; camera; fullscreen; display-capture"></iframe>
    </div>

    <script>
        function toggleFullscreen() {
            let elem = document.documentElement; // Makes the entire webpage go fullscreen
            
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari support */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 support */
                    elem.msRequestFullscreen();
                }
                document.querySelector('.fullscreen-btn').innerText = "❌ Exit Fullscreen";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                document.querySelector('.fullscreen-btn').innerText = "📺 Go Fullscreen";
            }
        }
    </script>

</body>
</html>
