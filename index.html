<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Dark sleek background */
            overflow: hidden;
        }
        /* Completely forces the frame to stay centered and fill its exact dimensions */
        iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw !important;  /* Forces width to 90% of the screen */
            height: 85vh !important; /* Forces height to 85% of the screen */
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: block;
        }
    </style>
</head>
<body>

    <!-- Removed the div wrapper completely so it stops squishing the frame -->
    <iframe src="https://minnit.chat" allow="geolocation; microphone; camera; fullscreen; display-capture"></iframe>

</body>
</html>
