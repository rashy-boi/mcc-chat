<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Dark sleek background */
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            overflow: hidden;
        }
        .chat-container {
            width: 95%;       /* Takes up 95% of screen width on mobile */
            max-width: 900px; /* Nice wide desktop size */
            height: 85vh;     /* Tall height on the screen */
            border-radius: 12px; /* Smooth rounded corners */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); /* Drop shadow effect */
            overflow: hidden;
            border: 2px solid #333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Using a direct clean iframe to fix the centering bugs -->
        <iframe src="https://organizations.minnit.chat/406692977852640/c/Main?embed" allow="geolocation; microphone; camera; fullscreen"></iframe>
    </div>

</body>
</html>
